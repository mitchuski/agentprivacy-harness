# manifest.yaml — pipeline state. Keystone-only writes (GR-10).
pipeline: corpus
version: 1
gates:
  - G0-conform        # node engine/conform.mjs examples/corpus green
  - G1-census         # node tools/census.mjs --gate → untraced 0, unquoted 0
  - G2-hard-constraint
  - G3-frontier-fold  # a weak claim retraced to a document folds best.metric down by one
  - G4-door           # publishing what the records say is the First Person's
rules:
  g4_owner: first-person
  keystone_only_writes: [frontier.json, claims_register.md, manifest.yaml, kb/records.json]
  scratch_dir: runs/
  chronicle_per_session: chronicles/
artifacts: {}
